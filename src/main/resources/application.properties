spring.application.name=rideflow

# ==================== Database ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rideflow_db}
spring.datasource.username=${DB_USERNAME:rideflow}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== Security ====================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ==================== Flyway ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false

# ==================== OpenAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==================== Redis Geospatial Caching ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

rideflow.redis.enabled=${REDIS_ENABLED:true}
rideflow.redis.driver-geo-key=rideflow:drivers:geo
rideflow.redis.driver-loc-key-prefix=rideflow:drivers:loc:
rideflow.redis.location-ttl-seconds=600

# ==================== Fare Estimation ====================
# Formula: max(minimum-fare, base-fare + distanceKm * per-km-rate), rounded HALF_UP to 2 decimals.
rideflow.fare.base-fare=50.00
rideflow.fare.per-km-rate=15.00
rideflow.fare.minimum-fare=50.00

# ==================== Dispatch & Matching ====================
rideflow.dispatch.offer-expiry-seconds=60
rideflow.dispatch.batch-size=1
rideflow.dispatch.max-retries=3
rideflow.dispatch.auto-re-dispatch=true

# ==================== Server ====================
server.port=${SERVER_PORT:8080}

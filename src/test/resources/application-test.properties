spring.application.name=rideflow-test

# ==================== H2 In-Memory Database ====================
spring.datasource.url=jdbc:h2:mem:rideflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ==================== Flyway ====================
# Disable Flyway in tests — H2 schema is managed by Hibernate ddl-auto
spring.flyway.enabled=false

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info

# ==================== JWT Security ====================
jwt.secret=test-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-testing!
jwt.expiration-ms=900000

# ==================== Fare Estimation ====================
rideflow.fare.base-fare=50.00
rideflow.fare.per-km-rate=15.00
rideflow.fare.minimum-fare=50.00

# ==================== Redis ====================
rideflow.redis.enabled=false
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false

# ==================== Dispatch & Matching ====================
rideflow.dispatch.offer-expiry-seconds=60
rideflow.dispatch.batch-size=1
rideflow.dispatch.max-retries=3
rideflow.dispatch.auto-re-dispatch=true
